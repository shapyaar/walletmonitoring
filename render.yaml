services:
  - type: web
    name: wallet-monitor
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    envVars:

      - key: RPC_URL
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false

      - key: POLL_SECONDS
        value: "60"

      - key: ENABLE_MONITOR
        value: "1"
